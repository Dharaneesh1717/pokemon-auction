<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pokémon Auction</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family: 'Poppins', sans-serif;
    color: white;
    overflow: hidden;

    /* YOUR BACKGROUND */
    background-image: url('/images/battlefield-bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* Very light overlay ONLY for text readability */
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(0, 0, 0, 0.08),
            transparent 35%,
            transparent 70%,
            rgba(0, 0, 0, 0.12)
        );

    pointer-events: none;
    z-index: 1;
}

/* Subtle scanline effect */
body::after {
    content: "";
    position: fixed;
    inset: 0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.018) 0px,
            rgba(255,255,255,0.018) 1px,
            transparent 1px,
            transparent 5px
        );

    pointer-events: none;
    z-index: 2;
}

/* =====================================================
   HOME
===================================================== */

.home {
    position: relative;

    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    z-index: 5;
}

/* =====================================================
   MAIN TITLE
===================================================== */

.title {
    display: flex;
    flex-direction: column;
    position: relative;
    top: -210px;
    align-items: center;
    justify-content: center;

    font-family: 'Orbitron', sans-serif;

    text-transform: uppercase;

    line-height: 0.95;

    text-align: center;

    user-select: none;

    filter:
        drop-shadow(0 5px 4px rgba(0,0,0,0.85))
        drop-shadow(0 0 15px rgba(0,220,255,0.45));
}

/* POKÉMON */

.pokemon-text {
    font-size: clamp(42px, 7vw, 82px);

    font-weight: 900;

    letter-spacing: 5px;

    color: #ffffff;

    -webkit-text-stroke: 2px rgba(0,0,0,0.75);

    text-shadow:
        0 4px 0 rgba(0,0,0,0.55),
        0 0 8px rgba(0,220,255,0.95),
        0 0 25px rgba(0,220,255,0.55);
}

/* AUCTION */

.auction-text {
    margin-top: 12px;

    font-size: clamp(32px, 5vw, 60px);

    font-weight: 900;

    letter-spacing: 9px;

    color: #ffe600;

    -webkit-text-stroke: 2px rgba(0,0,0,0.75);

    text-shadow:
        0 4px 0 rgba(0,0,0,0.55),
        0 0 8px rgba(255,230,0,1),
        0 0 24px rgba(255,190,0,0.65);
}

/* =====================================================
   DECORATIVE LINE
===================================================== */

.title-line {
    width: min(570px, 75vw);

    height: 4px;

    margin-top: 24px;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00ddff 20%,
            #ffe600 50%,
            #ff4035 80%,
            transparent
        );

    box-shadow:
        0 0 10px rgba(0,220,255,0.8),
        0 0 18px rgba(255,220,0,0.45);
}

/* =====================================================
   POKÉBALL LOGO
===================================================== */

.pokeball-logo {
    position: relative;

    width: 145px;
    height: 145px;

    margin-top: -180px;
    margin-bottom: 50px;

    border-radius: 50%;

    background:
        linear-gradient(
            to bottom,
            #f02b24 0%,
            #f02b24 47%,
            #171717 47%,
            #171717 53%,
            #ffffff 53%,
            #ffffff 100%
        );

    border: 5px solid rgba(255,255,255,0.95);

    box-shadow:
        0 0 15px rgba(255,255,255,0.75),
        0 0 30px rgba(255,50,40,0.55),
        0 0 55px rgba(0,210,255,0.25),
        inset 0 0 15px rgba(0,0,0,0.45);

    z-index: 6;

    overflow: hidden;
}

/* Pokéball upper shine */
.pokeball-logo::before {
    content: "";

    position: absolute;

    left: 15%;
    top: 8%;

    width: 35%;
    height: 18%;

    border-radius: 50%;

    background: rgba(255,255,255,0.30);

    transform: rotate(-25deg);

    filter: blur(2px);
}

/* Pokéball center button */
.pokeball-center {
    position: absolute;

    width: 48px;
    height: 48px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: #ffffff;

    border: 7px solid #171717;

    box-shadow:
        0 0 0 4px rgba(255,255,255,0.9),
        0 0 14px rgba(255,255,255,0.8),
        0 0 25px rgba(0,220,255,0.45);

    z-index: 3;
}

/* =====================================================
   POKÉBALL MOBILE
===================================================== */

@media (max-width: 600px) {

    .pokeball-logo {
        width: 105px;
        height: 105px;

        margin-top: 15px;
        margin-bottom: 4px;

        border-width: 4px;
    }

    .pokeball-center {
        width: 36px;
        height: 36px;

        border-width: 5px;
    }
}
/* =====================================================
   START AUCTION BUTTON
===================================================== */

.start-button {
    position: relative;

    width: min(420px, 72vw);

    height: 68px;

    margin-top: -10px;

    border: 3px solid rgba(255,255,255,0.85);

    border-radius: 15px;

    cursor: pointer;

    font-family: 'Orbitron', sans-serif;

    font-size: clamp(13px, 2vw, 17px);

    font-weight: 900;

    letter-spacing: 3px;

    color: white;

    background:
        linear-gradient(
            135deg,
            rgba(225,35,25,0.96),
            rgba(255,75,30,0.96),
            rgba(205,25,18,0.96)
        );

    box-shadow:
        0 7px 0 rgba(70,8,5,0.85),
        0 0 25px rgba(255,55,35,0.60),
        0 0 50px rgba(255,55,35,0.22),
        inset 0 2px 0 rgba(255,255,255,0.35);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        filter 0.15s ease;
}

.start-button::before {
    content: "⚡";

    position: absolute;

    left: 22px;
    top: 50%;

    transform: translateY(-50%);

    color: #ffe600;

    font-size: 22px;

    text-shadow:
        0 0 8px rgba(255,230,0,1);
}

.start-button::after {
    content: "⚡";

    position: absolute;

    right: 22px;
    top: 50%;

    transform: translateY(-50%);

    color: #ffe600;

    font-size: 22px;

    text-shadow:
        0 0 8px rgba(255,230,0,1);
}

.start-button:hover {
    transform: translateY(-4px);

    filter: brightness(1.12);

    box-shadow:
        0 11px 0 rgba(70,8,5,0.85),
        0 0 32px rgba(255,55,35,0.75),
        0 0 60px rgba(255,55,35,0.30),
        inset 0 2px 0 rgba(255,255,255,0.4);
}

.start-button:active {
    transform: translateY(5px);

    box-shadow:
        0 2px 0 rgba(70,8,5,0.85),
        0 0 22px rgba(255,55,35,0.55);
}

/* =====================================================
   ELEMENTAL DECORATIONS
===================================================== */

.element {
    position: fixed;

    z-index: 4;

    font-family: 'Poppins', sans-serif;

    font-size: 34px;

    font-weight: 900;

    user-select: none;

    pointer-events: none;

    opacity: 0.88;
}

/* FIRE */

.fire {
    left: 9%;
    top: 20%;

    color: #ff492e;

    text-shadow:
        0 0 8px #ff301c,
        0 0 22px rgba(255,70,30,0.8);

    transform: rotate(-12deg);
}

/* WATER */

.water {
    right: 10%;
    top: 19%;

    color: #27d9ff;

    text-shadow:
        0 0 8px #00cfff,
        0 0 22px rgba(0,190,255,0.8);

    transform: rotate(10deg);
}

/* ELECTRIC */

.electric {
    left: 17%;
    bottom: 18%;

    color: #ffe600;

    text-shadow:
        0 0 8px #ffe600,
        0 0 22px rgba(255,220,0,0.8);

    transform: rotate(-15deg);
}

/* GRASS */

.grass {
    right: 16%;
    bottom: 19%;

    color: #65e64e;

    text-shadow:
        0 0 8px #52df3c,
        0 0 22px rgba(60,220,50,0.75);

    transform: rotate(13deg);
}

/* ICE */

.ice {
    left: 6%;
    top: 48%;

    color: #b9f5ff;

    text-shadow:
        0 0 8px #7deaff,
        0 0 22px rgba(100,225,255,0.75);

    font-size: 27px;

    transform: rotate(-18deg);
}

/* PSYCHIC */

.psychic {
    right: 6%;
    top: 49%;

    color: #e56bff;

    text-shadow:
        0 0 8px #dc55ff,
        0 0 22px rgba(210,60,255,0.75);

    font-size: 29px;

    transform: rotate(17deg);
}

/* =====================================================
   SMALL ENERGY DOTS
===================================================== */

.energy-dot {
    position: fixed;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    z-index: 3;

    pointer-events: none;

    animation: float 3s ease-in-out infinite;
}

.dot1 {
    left: 25%;
    top: 25%;

    background: #00ddff;

    box-shadow: 0 0 12px #00ddff;
}

.dot2 {
    right: 24%;
    top: 29%;

    background: #ffe600;

    box-shadow: 0 0 12px #ffe600;

    animation-delay: 1s;
}

.dot3 {
    left: 28%;
    bottom: 27%;

    background: #ff4935;

    box-shadow: 0 0 12px #ff4935;

    animation-delay: 1.7s;
}

.dot4 {
    right: 27%;
    bottom: 25%;

    background: #62e94f;

    box-shadow: 0 0 12px #62e94f;

    animation-delay: 2.2s;
}

@keyframes float {

    0%,
    100% {
        transform: translateY(0);
        opacity: 0.55;
    }

    50% {
        transform: translateY(-10px);
        opacity: 1;
    }
}

/* =====================================================
   GAME IFRAME
===================================================== */

#gameFrame {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    border: none;

    display: none;

    z-index: 10;

    background: transparent;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .pokemon-text {
        font-size: 39px;
        letter-spacing: 3px;
    }

    .auction-text {
        font-size: 27px;
        letter-spacing: 5px;
    }

    .title-line {
        margin-top: 18px;
    }

    .start-button {
        height: 60px;
        margin-top: 30px;
        letter-spacing: 2px;
    }

    .element {
        font-size: 25px;
    }

    .ice,
    .psychic {
        display: none;
    }
}

@media (max-height: 650px) {

    .pokemon-text {
        font-size: 42px;
    }

    .auction-text {
        font-size: 30px;
    }

    .title-line {
        margin-top: 15px;
    }

    .start-button {
        height: 56px;
        margin-top: 25px;
    }

    .element {
        font-size: 25px;
    }
}












</style>
</head>

<body>

<!-- =====================================================
     ELEMENTAL DECORATIONS
===================================================== -->

<div class="element fire">🔥</div>
<div class="element water">💧</div>
<div class="element electric">⚡</div>
<div class="element grass">☘</div>
<div class="element ice">❄</div>
<div class="element psychic">✦</div>

<div class="energy-dot dot1"></div>
<div class="energy-dot dot2"></div>
<div class="energy-dot dot3"></div>
<div class="energy-dot dot4"></div>


<!-- =====================================================
     HOME SCREEN
===================================================== -->

<div class="home" id="homeScreen">

    <h1 class="title">

        <span class="pokemon-text">
            POKEMON
        </span>

        <span class="auction-text">
            AUCTION
        </span>

    </h1>

    <div class="title-line"></div>
    <div class="pokeball-logo">
    <div class="pokeball-center"></div>
</div>
    <button
        class="start-button"
        id="startAuctionButton">

        START AUCTION

    </button>

</div>


<!-- =====================================================
     GAME FRAME
===================================================== -->

<iframe
    id="gameFrame"
    src="about:blank"
    allow="autoplay">
</iframe>


<!-- =====================================================
     BACKGROUND MUSIC
===================================================== -->

<audio id="backgroundMusic" loop preload="auto">
    <source src="/music/background.mp3" type="audio/mpeg">
</audio>


<script>
document.addEventListener("DOMContentLoaded", () => {

    const homeScreen =
        document.getElementById("homeScreen");

    const gameFrame =
        document.getElementById("gameFrame");

    const startAuctionButton =
        document.getElementById("startAuctionButton");

    const backgroundMusic =
        document.getElementById("backgroundMusic");


    startAuctionButton.addEventListener("click", () => {

        backgroundMusic.volume = 0.35;
        backgroundMusic.play().catch(error => {
            console.log("Music could not start:", error);
        });

        homeScreen.style.display = "none";
        gameFrame.style.display = "block";
        gameFrame.src = "setup.html";

    });


    // =====================================================
    // MUSIC CONTROL FROM IFRAME (setup / lobby)
    // =====================================================

    window.addEventListener("message", function (event) {

        if (!event.data || !event.data.type) {
            return;
        }

        if (event.data.type === "getMusicState") {

            const isPlaying =
                backgroundMusic &&
                !backgroundMusic.paused;

            if (event.source) {
                event.source.postMessage(
                    {
                        type: "musicState",
                        playing: !!isPlaying
                    },
                    "*"
                );
            }

        } else if (event.data.type === "toggleMusic") {

            if (!backgroundMusic) {
                return;
            }

            if (backgroundMusic.paused) {

                backgroundMusic.play().catch(function () {});

                if (event.source) {
                    event.source.postMessage(
                        {
                            type: "musicState",
                            playing: true
                        },
                        "*"
                    );
                }

            } else {

                backgroundMusic.pause();

                if (event.source) {
                    event.source.postMessage(
                        {
                            type: "musicState",
                            playing: false
                        },
                        "*"
                    );
                }
            }

        } else if (event.data.type === "stopMusic") {

            if (backgroundMusic) {
                backgroundMusic.pause();
                backgroundMusic.currentTime = 0;
            }

            if (event.source) {
                event.source.postMessage(
                    {
                        type: "musicState",
                        playing: false
                    },
                    "*"
                );
            }
        }

    });

});








</script>

<script>

/* ===== Button click sound ===== */
(function () {
  var clickAudio = null;
  function getClickAudio() {
    if (!clickAudio) {
      clickAudio = new Audio("/sounds/button-click.mp3");
      clickAudio.preload = "auto";
      clickAudio.volume = 0.45;
    }
    return clickAudio;
  }
  function playButtonClick() {
    try {
      var a = getClickAudio();
      a.currentTime = 0;
      var p = a.play();
      if (p && typeof p.catch === "function") p.catch(function () {});
    } catch (e) {}
  }
  document.addEventListener(
    "click",
    function (e) {
      var btn = e.target.closest(
        'button, input[type="button"], input[type="submit"], .action-button, .start-button, .return-lobby-btn, .exit-game-btn, .champion-continue-btn'
      );
      if (!btn) return;
      if (btn.disabled) return;
      playButtonClick();
    },
    true
  );
  window.playButtonClick = playButtonClick;
})();

</script>
</body>
</html>
