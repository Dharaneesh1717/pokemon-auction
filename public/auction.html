<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pokémon Auction</title>

<script src="/socket.io/socket.io.js"></script>
<script>

/* ===== Button click sound ===== */
(function () {
  var clickAudio = null;
  function getClickAudio() {
    if (!clickAudio) {
      clickAudio = new Audio("/sounds/button-click.mp3");
      clickAudio.preload = "auto";
      clickAudio.volume = 0.45;
    }
    return clickAudio;
  }
  function playButtonClick() {
    try {
      var a = getClickAudio();
      a.currentTime = 0;
      var p = a.play();
      if (p && typeof p.catch === "function") p.catch(function () {});
    } catch (e) {}
  }
  document.addEventListener(
    "click",
    function (e) {
      var btn = e.target.closest(
        'button, input[type="button"], input[type="submit"], .action-button, .start-button, .return-lobby-btn, .exit-game-btn, .champion-continue-btn'
      );
      if (!btn) return;
      if (btn.disabled) return;
      playButtonClick();
    },
    true
  );
  window.playButtonClick = playButtonClick;
})();

</script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap');

* {
box-sizing: border-box;
}

html,
body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;

font-family: 'Poppins', sans-serif;
color: white;

background:
radial-gradient(
ellipse at 50% 35%,
#1a3a5c 0%,
#0c1a2e 42%,
#050b14 78%,
#020508 100%
);

transition: background 1s ease;
}


/* =====================================================
BACKGROUND
===================================================== */

body::before {
content: "";

position: fixed;
inset: 0;

pointer-events: none;
z-index: 0;

background:
radial-gradient(
circle at 15% 20%,
rgba(0,220,255,0.14),
transparent 25%
),

radial-gradient(
circle at 85% 20%,
rgba(255,220,0,0.10),
transparent 25%
),

radial-gradient(
circle at 50% 90%,
rgba(255,60,40,0.08),
transparent 30%
);
}

body::after {
content: "";

position: fixed;
inset: 0;

pointer-events: none;
z-index: 100;

background:
repeating-linear-gradient(
0deg,
rgba(255,255,255,0.018) 0px,
rgba(255,255,255,0.018) 1px,
transparent 1px,
transparent 5px
);
}


/* =====================================================
MAIN
===================================================== */

.auction-page {
position: relative;
z-index: 2;

width: 100%;
height: 100vh;

display: grid;

grid-template-columns:
minmax(220px, 260px)
1fr
minmax(250px, 310px);

gap: 12px;
padding: 12px;
}


/* =====================================================
PANELS
===================================================== */

.panel {
position: relative;

background:
linear-gradient(
145deg,
rgba(8,25,42,0.92),
rgba(5,13,24,0.86)
);

border: 1px solid rgba(0,220,255,0.22);
border-radius: 18px;

box-shadow:
0 20px 50px rgba(0,0,0,0.55),
inset 0 1px rgba(255,255,255,0.07),
0 0 25px rgba(0,180,255,0.06);

overflow: hidden;
}

.panel::before {
content: "";

position: absolute;

left: 0;
right: 0;
top: 0;

height: 3px;

background:
linear-gradient(
90deg,
#00ddff,
#ffe600 50%,
#ff4035
);

box-shadow:
0 0 12px rgba(0,220,255,0.6);

z-index: 5;
}


/* =====================================================
LEFT PANEL
===================================================== */

.players-panel {
display: flex;
flex-direction: column;

min-height: 0;
}

.panel-title {
padding: 18px 16px 12px;

font-family: 'Orbitron', sans-serif;

font-size: 16px;
font-weight: 900;

letter-spacing: 2px;

text-align: center;

text-shadow:
0 0 8px rgba(0,220,255,0.65);

border-bottom:
1px solid rgba(0,220,255,0.14);
}

.panel-title::after {
content: "";

display: block;

width: 70%;
height: 2px;

margin: 9px auto 0;

background:
linear-gradient(
90deg,
transparent,
#00ddff,
transparent
);

box-shadow:
0 0 8px rgba(0,220,255,0.7);
}

.players-list {
padding: 10px;

overflow-y: auto;

min-height: 0;

flex: 1;
}


/* =====================================================
PLAYER CARD
===================================================== */

.player-card {
position: relative;

margin-bottom: 9px;
padding: 12px;

border-radius: 13px;

background:
linear-gradient(
135deg,
rgba(0,220,255,0.07),
rgba(0,0,0,0.30)
);

border:
1px solid rgba(255,255,255,0.09);

transition:
transform 0.2s,
background 0.2s,
border 0.2s;
}

.player-card:hover {
transform: translateX(3px);

border-color:
rgba(0,220,255,0.38);

background:
linear-gradient(
135deg,
rgba(0,220,255,0.12),
rgba(0,0,0,0.30)
);
}

.player-card.highest {
border-color:
rgba(255,215,0,0.85);

background:
linear-gradient(
135deg,
rgba(255,215,0,0.15),
rgba(255,255,255,0.035)
);

box-shadow:
0 0 18px rgba(255,215,0,0.18);
}

.player-name {
font-family: 'Orbitron', sans-serif;

font-size: 13px;
font-weight: 800;

white-space: nowrap;

overflow: hidden;

text-overflow: ellipsis;
}

.player-money {
margin-top: 6px;

color: #ffd84d;

font-size: 13px;
font-weight: 700;
}

.player-team {
margin-top: 5px;

font-size: 11px;

opacity: 0.65;
}

.highest-label {
position: absolute;

top: 8px;
right: 8px;

color: #ffe600;

font-size: 8px;
font-weight: 900;

letter-spacing: 0.7px;

text-shadow:
0 0 8px rgba(255,220,0,0.8);
}


/* =====================================================
CENTER
===================================================== */

.auction-center {
min-width: 0;

display: flex;
flex-direction: column;

position: relative;

--pokemon-color: rgba(0,220,255,0.22);

transition:
box-shadow 0.8s ease,
border-color 0.8s ease;
}

.auction-center::after {
content: "";

position: absolute;
inset: 0;

pointer-events: none;

background:
radial-gradient(
circle at 50% 42%,
color-mix(in srgb, var(--pokemon-color) 85%, white 15%) 0%,
color-mix(in srgb, var(--pokemon-color) 45%, transparent) 28%,
transparent 68%
);

opacity: 0.55;

transition:
background 0.8s ease,
opacity 0.8s ease;

z-index: 0;
}

.auction-center > * {
position: relative;
z-index: 2;
}


/* =====================================================
TOP BAR
===================================================== */

.top-bar {
display: flex;

justify-content: space-between;
align-items: center;

padding: 13px 16px;

border-bottom:
1px solid rgba(0,220,255,0.08);
}

.lobby-code {
font-family: 'Orbitron', sans-serif;

font-size: 10px;

opacity: 0.65;

letter-spacing: 2px;

color: #8eeeff;
}

.wallet {
display: flex;

align-items: center;

gap: 8px;

padding: 8px 14px;

border-radius: 999px;

background:
rgba(0,0,0,0.34);

border:
1px solid rgba(255,215,0,0.28);

box-shadow:
0 0 15px rgba(255,215,0,0.08);

font-weight: 800;
}

.wallet-icon {
font-size: 17px;
}

.money-value {
color: #ffd84d;

text-shadow:
0 0 8px rgba(255,210,50,0.35);
}


/* =====================================================
AUCTION ARENA
===================================================== */

.auction-arena {
flex: 1;

min-height: 0;

display: flex;
flex-direction: column;

align-items: center;
justify-content: center;

position: relative;

padding: 10px 30px 25px;
}

.auction-arena::before {
content: "";

position: absolute;

width: min(500px, 70%);

aspect-ratio: 1;

border-radius: 50%;

border:
1px solid color-mix(
in srgb,
var(--pokemon-color) 40%,
transparent
);

box-shadow:
0 0 45px
color-mix(
in srgb,
var(--pokemon-color) 18%,
transparent
);

pointer-events: none;

transition:
border-color 0.8s ease,
box-shadow 0.8s ease;
}

.auction-arena::after {
content: "";

position: absolute;

width: min(350px, 55%);

aspect-ratio: 1;

border-radius: 50%;

border:
1px dashed
color-mix(
in srgb,
var(--pokemon-color) 30%,
transparent
);

pointer-events: none;

transition:
border-color 0.8s ease;
}

.arena-title {
position: relative;

z-index: 2;

font-family: 'Orbitron', sans-serif;

font-size: 11px;

letter-spacing: 4px;

font-weight: 900;

color: #8eeeff;

margin-bottom: 10px;

text-shadow:
0 0 10px rgba(0,220,255,0.55);
}


/* =====================================================
HIDDEN POKEMON
===================================================== */

.hidden-pokemon {
position: relative;
z-index: 2;
width: min(260px, 36vh);
height: min(260px, 36vh);
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
background:
radial-gradient(
circle at 50% 45%,
color-mix(in srgb, var(--pokemon-color) 55%, transparent) 0%,
color-mix(in srgb, var(--pokemon-color) 22%, transparent) 42%,
transparent 72%
);
border: 2px solid color-mix(in srgb, var(--pokemon-color) 70%, white 15%);
box-shadow:
0 0 28px color-mix(in srgb, var(--pokemon-color) 65%, transparent),
0 0 60px color-mix(in srgb, var(--pokemon-color) 40%, transparent),
0 0 100px color-mix(in srgb, var(--pokemon-color) 22%, transparent),
inset 0 0 40px color-mix(in srgb, var(--pokemon-color) 18%, transparent);
transition: background 0.8s ease, border-color 0.8s ease, box-shadow 0.8s ease;
animation: hiddenPulse 2.4s ease-in-out infinite;
}

.hidden-pokemon::before {
content: "";
position: absolute;
inset: -18px;
border-radius: 50%;
border: 2px solid color-mix(in srgb, var(--pokemon-color) 55%, transparent);
box-shadow: 0 0 24px color-mix(in srgb, var(--pokemon-color) 35%, transparent);
animation: ringRotate 6s linear infinite;
}

.hidden-pokemon::after {
content: "";
position: absolute;
inset: -36px;
border-radius: 50%;
border: 1px dashed color-mix(in srgb, var(--pokemon-color) 40%, transparent);
box-shadow: 0 0 30px color-mix(in srgb, var(--pokemon-color) 20%, transparent);
animation: ringRotate 11s linear infinite reverse;
}

@keyframes hiddenPulse {
0%, 100% { transform: scale(1); filter: brightness(1); }
50% { transform: scale(1.04); filter: brightness(1.12); }
}

@keyframes ringRotate {
from { transform: rotate(0deg); }
to { transform: rotate(360deg); }
}

/* Mystery Pokéball (shadowed) */
.mystery-pokeball {
position: relative;
width: 58%;
height: 58%;
border-radius: 50%;
overflow: hidden;
z-index: 3;
box-shadow:
0 8px 24px rgba(0,0,0,0.75),
0 0 20px color-mix(in srgb, var(--pokemon-color) 45%, transparent);
filter: brightness(0.28) contrast(1.25) saturate(0.7);
animation: ballFloat 3s ease-in-out infinite;
}

@keyframes ballFloat {
0%, 100% { transform: translateY(0); }
50% { transform: translateY(-6px); }
}

.mystery-pokeball .mp-top {
position: absolute;
left: 0; right: 0; top: 0;
height: 50%;
background: linear-gradient(180deg, #c62828 0%, #8b0000 100%);
}

.mystery-pokeball .mp-bottom {
position: absolute;
left: 0; right: 0; bottom: 0;
height: 50%;
background: linear-gradient(180deg, #d0d0d0 0%, #9a9a9a 100%);
}

.mystery-pokeball .mp-band {
position: absolute;
left: 0; right: 0;
top: 50%;
height: 10%;
transform: translateY(-50%);
background: #1a1a1a;
z-index: 2;
}

.mystery-pokeball .mp-button {
position: absolute;
left: 50%;
top: 50%;
width: 22%;
height: 22%;
transform: translate(-50%, -50%);
border-radius: 50%;
background: radial-gradient(circle at 35% 30%, #fff 0%, #c8c8c8 45%, #666 100%);
border: 3px solid #1a1a1a;
z-index: 3;
box-shadow: 0 0 8px rgba(0,0,0,0.5);
}

.mystery-pokeball .mp-button::after {
content: "";
position: absolute;
inset: 22%;
border-radius: 50%;
background: radial-gradient(circle at 40% 35%, #eee, #888);
border: 1px solid #333;
}

.question-mark { display: none; }


/* =====================================================
CLUE
===================================================== */

.clue-box {
position: relative;

z-index: 2;

width: min(650px, 90%);

margin-top: 22px;

padding: 13px 18px;

text-align: center;

border-radius: 14px;

background:
linear-gradient(
135deg,
rgba(0,220,255,0.08),
rgba(0,0,0,0.38)
);

border:
1px solid rgba(0,220,255,0.20);

box-shadow:
0 0 18px rgba(0,220,255,0.05),
inset 0 1px rgba(255,255,255,0.05);

font-size: 14px;

line-height: 1.5;

min-height: 48px;

display: flex;

align-items: center;
justify-content: center;
}


/* =====================================================
PRICE
===================================================== */

.price-row {
position: relative;

z-index: 2;

display: flex;

gap: 14px;

margin-top: 17px;
}

.price-box {
min-width: 135px;

padding: 10px 15px;

text-align: center;

border-radius: 13px;

background:
rgba(0,0,0,0.34);

border:
1px solid rgba(255,255,255,0.10);
}

.price-label {
display: block;

font-family: 'Orbitron', sans-serif;

font-size: 8px;

opacity: 0.55;

letter-spacing: 1.5px;
}

.price-number {
margin-top: 4px;

font-size: 21px;

font-weight: 900;

color: #ffe45b;

text-shadow:
0 0 8px rgba(255,220,0,0.25);
}


/* =====================================================
TIMER
===================================================== */

.timer {
position: relative;

z-index: 2;

width: 82px;
height: 82px;

margin-top: 16px;

border-radius: 50%;

display: flex;

align-items: center;
justify-content: center;

font-family: 'Orbitron', sans-serif;

font-size: 27px;

font-weight: 900;

background:
radial-gradient(
circle,
rgba(0,220,255,0.10),
rgba(255,255,255,0.015)
);

border:
4px solid rgba(0,220,255,0.30);

box-shadow:
0 0 25px rgba(0,220,255,0.12);

transition:
border-color 0.2s,
color 0.2s,
box-shadow 0.2s;
}

.timer.warning {
border-color: #ffb52e;

color: #ffd45b;

box-shadow:
0 0 30px rgba(255,120,30,0.35);

animation:
timerShake 0.35s infinite alternate;
}

.timer.danger {
border-color: #ff4444;

color: #ff6565;

box-shadow:
0 0 35px rgba(255,40,40,0.45);

animation:
timerShake 0.18s infinite alternate;
}

@keyframes timerShake {

from {
transform: scale(1);
}

to {
transform: scale(1.07);
}
}


/* =====================================================
BUTTONS
===================================================== */

.controls {
position: relative;

z-index: 2;

display: flex;

gap: 12px;

margin-top: 16px;
}

.action-button {
position: relative;

border: none;

padding: 13px 28px;

border-radius: 13px;

color: white;

font-family: 'Orbitron', sans-serif;

font-weight: 900;

font-size: 12px;

letter-spacing: 1px;

cursor: pointer;

transition:
transform 0.15s,
filter 0.15s,
opacity 0.15s;

box-shadow:
0 7px 0 rgba(0,0,0,0.45),
0 10px 22px rgba(0,0,0,0.25);
}

.action-button:hover {
transform: translateY(-3px);

filter: brightness(1.12);
}

.action-button:active {
transform: translateY(3px);

box-shadow:
0 3px 0 rgba(0,0,0,0.45);
}

.bid-button {
background:
linear-gradient(
135deg,
#087dff,
#5944e8
);

border:
1px solid rgba(120,210,255,0.35);

box-shadow:
0 7px 0 rgba(20,35,100,0.75),
0 0 22px rgba(30,120,255,0.28);
}

.skip-button {
background:
linear-gradient(
135deg,
#4c5566,
#282d37
);

border:
1px solid rgba(255,255,255,0.14);
}

.action-button:disabled {
opacity: 0.35;

cursor: not-allowed;

transform: none;

filter: none;
}

.money-info {
position: relative;

z-index: 2;

margin-top: 10px;

font-size: 10px;

opacity: 0.70;

text-align: center;
}

.money-info strong {
color: #ffd84d;
}


/* =====================================================
TEAM PANEL
===================================================== */

.team-panel {
display: flex;

flex-direction: column;

min-height: 0;
}

.team-header {
padding: 18px 15px 12px;

text-align: center;

border-bottom:
1px solid rgba(0,220,255,0.10);
}

.team-title {
font-family: 'Orbitron', sans-serif;

font-size: 16px;

font-weight: 900;

letter-spacing: 2px;

text-shadow:
0 0 8px rgba(0,220,255,0.55);
}

.team-count {
margin-top: 5px;

font-size: 11px;

opacity: 0.60;
}

.team-grid {
padding: 12px;

flex: 1;

min-height: 0;

overflow-y: auto;

display: grid;

grid-template-columns:
repeat(2, minmax(0, 1fr));

align-content: start;

gap: 10px;
}


/* =====================================================
TEAM SLOT
===================================================== */

.team-slot {
min-height: 125px;

border-radius: 14px;

background:
linear-gradient(
145deg,
rgba(0,220,255,0.055),
rgba(0,0,0,0.27)
);

border:
1px solid rgba(255,255,255,0.09);

display: flex;

flex-direction: column;

align-items: center;

justify-content: center;

overflow: hidden;

position: relative;

transition:
transform 0.25s,
border-color 0.5s,
background 0.5s,
box-shadow 0.5s;
}

.team-slot.empty {
opacity: 0.40;

border-style: dashed;
}

.team-slot.has-pokemon {
background:
radial-gradient(
circle at 50% 30%,
color-mix(
in srgb,
var(--team-color, #00ddff) 22%,
transparent
),
rgba(0,0,0,0.60) 72%
);

border-color:
color-mix(
in srgb,
var(--team-color, #00ddff) 50%,
rgba(255,255,255,0.12)
);

box-shadow:
0 0 18px
color-mix(
in srgb,
var(--team-color, #00ddff) 20%,
transparent
),

inset 0 0 18px
color-mix(
in srgb,
var(--team-color, #00ddff) 7%,
transparent
);
}

.team-slot.has-pokemon:hover {
transform:
translateY(-3px)
scale(1.015);

border-color:
var(--team-color, #00ddff);

box-shadow:
0 0 25px
color-mix(
in srgb,
var(--team-color, #00ddff) 30%,
transparent
);
}

.team-slot img {
width: 92px;
height: 92px;

object-fit: contain;

filter:
drop-shadow(
0 8px 12px rgba(0,0,0,0.60)
);

transition:
transform 0.25s ease,
filter 0.25s ease;
}

.team-slot.has-pokemon:hover img {
transform: scale(1.12);

filter:
drop-shadow(
0 0 12px
var(--team-color, #00ddff)
)

drop-shadow(
0 8px 10px rgba(0,0,0,0.55)
);
}

.team-name {
width: 100%;

text-align: center;

padding: 5px 4px 8px;

font-size: 10px;

font-weight: 900;

white-space: nowrap;

overflow: hidden;

text-overflow: ellipsis;
}


/* =====================================================
REVEAL OVERLAY
===================================================== */

.reveal-overlay {
position: fixed;

inset: 0;

z-index: 200;

display: none;

align-items: center;

justify-content: center;

background:
radial-gradient(
circle at center,
rgba(10,45,75,0.88),
rgba(0,5,12,0.97)
);

backdrop-filter: blur(10px);
}

.reveal-overlay::before {
content: "";

position: absolute;

width: 65vw;
height: 65vw;

max-width: 700px;
max-height: 700px;

border-radius: 50%;

border:
1px solid rgba(0,220,255,0.20);

box-shadow:
0 0 60px rgba(0,220,255,0.12);

animation:
revealRing 8s linear infinite;
}

.reveal-overlay.show {
display: flex;
}


/* =====================================================
FINAL RESULTS OVERLAY
===================================================== */

/* =====================================================
   GRAND CHAMPION OVERLAY + FIREWORKS
===================================================== */

.champion-overlay {
position: fixed;
inset: 0;
z-index: 400;
display: flex;
align-items: center;
justify-content: center;
background:
radial-gradient(
circle at 50% 40%,
rgba(20, 10, 40, 0.92),
rgba(0, 2, 8, 0.98)
);
opacity: 0;
visibility: hidden;
pointer-events: none;
transition: opacity 0.8s ease, visibility 0.8s ease;
overflow: hidden;
}

.champion-overlay.show {
opacity: 1;
visibility: visible;
pointer-events: auto;
}

.fireworks-canvas {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
pointer-events: none;
z-index: 1;
}

.champion-content {
position: relative;
z-index: 2;
text-align: center;
padding: 28px 24px;
max-width: 560px;
width: 92vw;
animation: championPop 0.9s cubic-bezier(0.22, 1.2, 0.36, 1) both;
}

@keyframes championPop {
0% { transform: scale(0.6); opacity: 0; }
60% { transform: scale(1.06); }
100% { transform: scale(1); opacity: 1; }
}

.champion-label {
font-family: 'Orbitron', sans-serif;
font-size: clamp(14px, 3.5vw, 18px);
font-weight: 800;
letter-spacing: 4px;
color: #ffd700;
text-shadow:
0 0 20px rgba(255, 215, 0, 0.8),
0 0 40px rgba(255, 160, 0, 0.5);
margin-bottom: 18px;
animation: labelPulse 1.8s ease-in-out infinite;
}

@keyframes labelPulse {
0%, 100% { opacity: 1; filter: brightness(1); }

@keyframes revealRing {

from {
transform: rotate(0deg);
}

to {
transform: rotate(360deg);
}
}


/* =====================================================
REVEAL CONTENT
===================================================== */

.reveal-content {
position: relative;

z-index: 2;

width: min(620px, 90vw);

text-align: center;

animation:
revealContent 1.15s cubic-bezier(.17,.89,.32,1.28);
}

@keyframes revealContent {

from {
opacity: 0;

transform:
scale(0.35)
rotate(-8deg);
}

70% {
opacity: 1;

transform:
scale(1.06)
rotate(2deg);
}

to {
opacity: 1;

transform:
scale(1)
rotate(0);
}
}


/* =====================================================
REVEAL IMAGE
===================================================== */

.reveal-image-wrapper {
width: min(300px, 52vw);
height: min(300px, 52vw);

margin: 0 auto;

position: relative;

display: flex;

align-items: center;
justify-content: center;
}

.reveal-image-wrapper::before {
content: "";

position: absolute;

inset: 0;

border-radius: 50%;

background:
radial-gradient(
circle,
rgba(0,220,255,0.22),
rgba(255,220,0,0.06) 40%,
transparent 70%
);

animation:
revealGlow 1.2s ease-in-out infinite alternate;
}

.reveal-image-wrapper::after {
content: "";

position: absolute;

inset: -15px;

border-radius: 50%;

border:
2px solid rgba(0,220,255,0.20);

animation:
revealRing 5s linear infinite reverse;
}

@keyframes revealGlow {

from {
transform: scale(0.88);
opacity: 0.55;
}

to {
transform: scale(1.1);
opacity: 1;
}
}

.reveal-image {
width: 85%;
height: 85%;

object-fit: contain;

position: relative;

z-index: 2;

filter:
drop-shadow(
0 25px 30px rgba(0,0,0,0.65)
);

animation:
pokemonAppear 1.05s cubic-bezier(.17,.89,.32,1.28);
}

@keyframes pokemonAppear {

from {
opacity: 0;

transform:
scale(0.2)
rotate(-15deg);
}

70% {
transform:
scale(1.12)
rotate(3deg);
}

to {
opacity: 1;

transform:
scale(1)
rotate(0);
}
}


/* =====================================================
REVEAL TEXT
===================================================== */

.reveal-title {
margin-top: 4px;

font-family: 'Orbitron', sans-serif;

font-size:
clamp(35px, 6vw, 72px);

font-weight: 900;

line-height: 0.95;

text-transform: uppercase;

letter-spacing: -2px;

color: white;

text-shadow:
0 0 12px rgba(0,220,255,0.75),
0 5px 25px rgba(0,0,0,0.8);
}

.reveal-subtitle {
margin-top: 13px;

font-family: 'Orbitron', sans-serif;

font-size: 16px;

font-weight: 900;

letter-spacing: 3px;

color: #8eeeff;
}

.reveal-price {
margin-top: 12px;

font-size: 27px;

font-weight: 900;

color: #ffd84d;

text-shadow:
0 0 20px rgba(255,210,60,0.45);
}

.sold-winner-name {
color: #ffd84d;
font-weight: 900;
font-size: 1.15em;
text-shadow:
0 0 14px rgba(255, 216, 77, 0.75),
0 0 28px rgba(255, 180, 0, 0.4);
letter-spacing: 0.5px;
}

.reveal-winner {
margin-top: 22px;
display: flex;
flex-direction: column;
align-items: center;
gap: 10px;
animation: soldTextFade 0.9s ease-out;
}

.reveal-winner-avatar {
width: 96px;
height: 96px;
border-radius: 50%;
object-fit: cover;
border: 3px solid #ffd84d;
box-shadow:
0 0 24px rgba(255, 216, 77, 0.65),
0 0 48px rgba(0, 220, 255, 0.35);
background: rgba(0, 0, 0, 0.35);
}

.reveal-winner-name {
font-size: 32px;
font-weight: 900;
letter-spacing: 1px;
color: #ffffff;
text-shadow:
0 0 18px rgba(0, 220, 255, 0.7),
0 2px 8px rgba(0, 0, 0, 0.8);
text-transform: uppercase;
}

.player-card.skipped {
filter: grayscale(1);
opacity: 0.42;
pointer-events: none;
transition: filter 0.25s ease, opacity 0.25s ease;
}


/* =====================================================
SOLD
===================================================== */

.reveal-overlay.sold {
animation:
soldFlash 0.7s ease-out;
}

@keyframes soldFlash {

0% {
background-color:
rgba(255,255,255,0.65);
}

100% {
background-color:
rgba(0,0,0,0.94);
}
}


/* Flashy effects over the sold Pokémon photo */
.reveal-overlay.sold .reveal-image-wrapper {
animation:
soldWrapperPulse 0.9s ease-out,
soldWrapperGlow 2.4s ease-in-out infinite alternate;
}

.reveal-overlay.sold .reveal-image {
animation:
pokemonAppear 1.05s cubic-bezier(.17,.89,.32,1.28),
soldImageShine 2.2s ease-in-out infinite;
filter:
drop-shadow(0 25px 30px rgba(0,0,0,0.65))
drop-shadow(0 0 28px rgba(255, 215, 60, 0.55))
drop-shadow(0 0 48px rgba(0, 220, 255, 0.35));
}

.reveal-overlay.sold .reveal-image-wrapper::before {
background:
radial-gradient(
circle,
rgba(255, 230, 80, 0.45),
rgba(0, 220, 255, 0.18) 42%,
transparent 70%
);
animation:
revealGlow 0.9s ease-in-out infinite alternate,
soldSparkle 1.4s linear infinite;
}

.reveal-overlay.sold .reveal-image-wrapper::after {
border-color: rgba(255, 215, 60, 0.55);
box-shadow:
0 0 24px rgba(255, 210, 60, 0.45),
inset 0 0 20px rgba(0, 220, 255, 0.15);
animation:
revealRing 3.2s linear infinite reverse,
soldRingPulse 1.6s ease-in-out infinite;
}

.reveal-overlay.sold .reveal-title {
animation:
soldTitlePop 0.7s cubic-bezier(.17,.89,.32,1.28);
text-shadow:
0 0 16px rgba(255, 220, 80, 0.9),
0 0 28px rgba(0, 220, 255, 0.55),
0 5px 25px rgba(0,0,0,0.8);
}

.reveal-overlay.sold .reveal-subtitle,
.reveal-overlay.sold .reveal-price {
animation:
soldTextFade 0.85s ease-out;
}

@keyframes soldWrapperPulse {
0% { transform: scale(0.86); }
60% { transform: scale(1.06); }
100% { transform: scale(1); }
}

@keyframes soldWrapperGlow {
from {
filter: brightness(1);
}
to {
filter: brightness(1.12);
}
}

@keyframes soldImageShine {
0%, 100% {
filter:
drop-shadow(0 25px 30px rgba(0,0,0,0.65))
drop-shadow(0 0 22px rgba(255, 215, 60, 0.4))
drop-shadow(0 0 40px rgba(0, 220, 255, 0.25));
}
50% {
filter:
drop-shadow(0 25px 30px rgba(0,0,0,0.65))
drop-shadow(0 0 36px rgba(255, 230, 90, 0.75))
drop-shadow(0 0 60px rgba(0, 220, 255, 0.5));
}
}

@keyframes soldSparkle {
0% { opacity: 0.55; transform: scale(0.9); }
50% { opacity: 1; transform: scale(1.12); }
100% { opacity: 0.7; transform: scale(1); }
}

@keyframes soldRingPulse {
0%, 100% { transform: scale(1); opacity: 0.85; }
50% { transform: scale(1.08); opacity: 1; }
}

@keyframes soldTitlePop {
from {
opacity: 0;
transform: scale(0.7) translateY(12px);
}
to {
opacity: 1;
transform: scale(1) translateY(0);
}
}

@keyframes soldTextFade {
from {
opacity: 0;
transform: translateY(10px);
}
to {
opacity: 1;
transform: translateY(0);
}
}


/* Party popper / confetti (visual only, no sound) */
.sold-party-layer {
position: absolute;
inset: 0;
pointer-events: none;
overflow: hidden;
z-index: 50;
}

.sold-spark {
position: absolute;
width: 14px;
height: 14px;
border-radius: 3px;
pointer-events: none;
opacity: 1;
z-index: 50;
animation: soldSparkFly 1.8s cubic-bezier(.15,.75,.25,1) forwards;
box-shadow:
0 0 8px currentColor,
0 0 16px currentColor;
will-change: transform, opacity;
}

.sold-spark.circle {
border-radius: 50%;
width: 12px;
height: 12px;
}

.sold-spark.burst {
width: 18px;
height: 18px;
border-radius: 4px;
animation-duration: 2.1s;
}

.sold-spark.streak {
width: 6px;
height: 28px;
border-radius: 6px;
animation-duration: 1.5s;
}

.sold-spark.ribbon {
width: 10px;
height: 36px;
border-radius: 2px;
animation-duration: 2.4s;
}

@keyframes soldSparkFly {
0% {
opacity: 1;
transform: translate(-50%, -50%) scale(1) rotate(0deg);
}
70% {
opacity: 1;
}
100% {
opacity: 0;
transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.35) rotate(var(--rot));
}
}

.sold-flash-ring {
position: absolute;
left: 50%;
top: 40%;
width: 60px;
height: 60px;
margin-left: -30px;
margin-top: -30px;
border-radius: 50%;
border: 4px solid rgba(255, 230, 100, 0.95);
box-shadow:
0 0 40px rgba(255, 210, 60, 0.85),
0 0 80px rgba(0, 220, 255, 0.5);
animation: soldFlashRing 1.15s ease-out forwards;
pointer-events: none;
z-index: 40;
}

@keyframes soldFlashRing {
0% {
opacity: 1;
transform: scale(0.2);
}
100% {
opacity: 0;
transform: scale(8);
}
}

.sold-popper-burst {
position: absolute;
width: 0;
height: 0;
pointer-events: none;
z-index: 45;
}

.sold-popper-burst::before,
.sold-popper-burst::after {
content: "";
position: absolute;
left: 0;
top: 0;
width: 22px;
height: 22px;
border-radius: 50%;
background: radial-gradient(circle, #fff 0%, #ffe566 40%, transparent 70%);
box-shadow: 0 0 30px #ffd700, 0 0 60px #00e5ff;
animation: soldPopperFlash 0.7s ease-out forwards;
}

@keyframes soldPopperFlash {
0% { opacity: 1; transform: scale(0.3); }
100% { opacity: 0; transform: scale(4); }
}


/* =====================================================
SKIPPED
===================================================== */

.reveal-overlay.skipped {
background:
radial-gradient(
circle at center,
rgba(40,55,70,0.90),
rgba(0,0,0,0.97)

}

SCREEN SHAKE
===================================================== */

<script>


/* =====================================================
SOCKET
===================================================== */

const socket = io();


/* =====================================================
SESSION
===================================================== */

const playerId =
sessionStorage.getItem("playerId");

const lobbyCode =
sessionStorage.getItem("lobbyCode");


/* =====================================================
ELEMENTS
===================================================== */

const playersList =
document.getElementById("playersList");

const teamGrid =
document.getElementById("teamGrid");

const teamCount =
document.getElementById("teamCount");

const myMoney =
document.getElementById("myMoney");

const moneyInfo =
document.getElementById("moneyInfo");

const lobbyCodeElement =
document.getElementById("lobbyCode");

const clue =
document.getElementById("clue");

const basePrice =
document.getElementById("basePrice");

const currentBid =
document.getElementById("currentBid");

const timer =
document.getElementById("timer");

const bidButton =
document.getElementById("bidButton");

const skipButton =
document.getElementById("skipButton");

const hiddenPokemon =
document.getElementById("hiddenPokemon");

const auctionCenter =
document.querySelector(".auction-center");

const revealOverlay =
document.getElementById("revealOverlay");

const revealImage =
document.getElementById("revealImage");

const revealTitle =
document.getElementById("revealTitle");

const revealSubtitle =
document.getElementById("revealSubtitle");

const revealPrice =
document.getElementById("revealPrice");

const errorMessage =
document.getElementById("errorMessage");


/* =====================================================
STATE
===================================================== */

let currentAuction = null;

let skippedThisPokemon = false;

let revealTimeout = null;

/*
* Prevent unnecessary rebuilding of team slots.
*/
let renderedTeamKey = "";

/*
* Cache Pokémon information so PokéAPI is not
* repeatedly requested during every auction update.
*/
const teamPokemonCache = new Map();


/* =====================================================
POKEMON TYPE COLORS
===================================================== */

const pokemonTypeColors = {

normal: "#A8A77A",

fire: "#F08030",

water: "#6890F0",

electric: "#F8D030",

grass: "#78C850",

ice: "#98D8D8",

fighting: "#C03028",

poison: "#A040A0",

ground: "#E0C068",

flying: "#A890F0",

psychic: "#F85888",

bug: "#A8B820",

rock: "#B8A038",

ghost: "#705898",

dragon: "#7038F8",

dark: "#705848",

steel: "#B8B8D0",

fairy: "#EE99AC"

};


/* =====================================================
GET TYPE
===================================================== */

function getPokemonType(pokemon) {

if (!pokemon) {
return null;
}

let types =
pokemon.types ||
pokemon.type ||
[];

if (typeof types === "string") {
types = [types];
}

if (
!Array.isArray(types) ||
types.length === 0
) {
return null;
}

const first =
types[0];

if (typeof first === "string") {
return first.toLowerCase();
}

return first?.type?.name?.toLowerCase() || null;
}


/* =====================================================
GET COLOR
===================================================== */

function getPokemonColor(pokemon) {

const type =
getPokemonType(pokemon);

return (
pokemonTypeColors[type] ||
"#00ddff"
);
}


/* =====================================================
SET AUCTION COLOR
===================================================== */

function setAuctionPokemonColor(pokemon) {

const color =
getPokemonColor(pokemon);

auctionCenter.style.setProperty(
"--pokemon-color",
color
);

/* Soft ambient tint on the whole auction room */
document.body.style.background =
`radial-gradient(ellipse at 50% 32%,
color-mix(in srgb, ${color} 28%, #1a3a5c) 0%,
#0c1a2e 45%,
#050b14 78%,
#020508 100%)`;
}


/* =====================================================
LOBBY CODE
===================================================== */

if (lobbyCode) {

lobbyCodeElement.textContent =
"LOBBY " + lobbyCode;
}


/* =====================================================
SOCKET CONNECT
===================================================== */

socket.on("connect", () => {

console.log(
"Connected to auction server."
);

if (
playerId &&
lobbyCode
) {

socket.emit(
"reconnectToLobby",
{
playerId:
playerId,

lobbyCode:
lobbyCode
}
);
}
});


/* =====================================================
AUCTION STATE
===================================================== */

socket.on(
"auctionState",
state => {

/*
* Detect a new Pokémon.
* This makes sure the player can skip again.
*/
if (
currentAuction &&
state &&
currentAuction.hint !== state.hint
) {

skippedThisPokemon =
false;
}

currentAuction =
state;

/*
* Sync auto-skip from server
* (cannot afford / full team).
* Exception: highest bidder is never treated as skipped.
*/
if (
state &&
Array.isArray(state.skippedPlayers) &&
state.skippedPlayers.includes(playerId) &&
state.highestBidder !== playerId
) {
    skippedThisPokemon = true;
}

updateAuctionState(
state
);
}
);


/* =====================================================
UPDATE AUCTION
===================================================== */

function updateAuctionState(state) {

if (!state) {
return;
}


/* -----------------------------------------------
DYNAMIC POKEMON TYPE COLOR

Pokémon remains hidden.
Only its type controls the arena color.
------------------------------------------------ */

if (state.pokemonType) {

setAuctionPokemonColor({
type:
state.pokemonType
});
}


/* -----------------------------------------------
CLUE
------------------------------------------------ */

clue.textContent =
state.hint ||
"A mysterious Pokémon awaits.";


/* -----------------------------------------------
PRICES
------------------------------------------------ */

basePrice.textContent =
"₹" +
Number(
state.basePrice || 0
).toLocaleString();

currentBid.textContent =
"₹" +
Number(
state.currentBid || 0
).toLocaleString();


/* -----------------------------------------------
TIMER
------------------------------------------------ */

const seconds =
Math.max(
0,
Number(
state.timeLeft || 0
)
);

timer.textContent =
seconds;

timer.classList.remove(
"warning",
"danger"
);

if (seconds <= 5) {

timer.classList.add(
"danger"
);

} else if (seconds <= 10) {

timer.classList.add(
"warning"
);
}


/* -----------------------------------------------
MY PLAYER
------------------------------------------------ */

const me =
state.players?.find(
player =>
player.playerId ===
playerId
);


/* -----------------------------------------------
MONEY
------------------------------------------------ */

if (me) {

myMoney.textContent =
"₹" +
Number(
me.money
).toLocaleString();

moneyInfo.innerHTML =
"Reserved: <strong>₹" +
Number(
me.requiredReserve || 0
).toLocaleString() +
"</strong> &nbsp; | &nbsp; " +
"Maximum safe bid: <strong>₹" +
Number(
me.maximumBid || 0
).toLocaleString() +
"</strong>";


renderTeam(
me.pokemon || [],
me.pokemonDetails || []
);


teamCount.textContent =
`${me.pokemonCount || 0} / 6`;
}


/* -----------------------------------------------
BUTTONS
------------------------------------------------ */

const alreadySkipped =
skippedThisPokemon;

const teamComplete =
me &&
me.pokemonCount >= 6;

const isHighestBidder =
state.highestBidder ===
playerId;

const auctionActive =
state.auctionActive;


/* -----------------------------------------------
FIRST BID VS SUBSEQUENT BID

The very first bid on a Pokémon equals the
current price (the base price). Every bid
after that adds the ₹10 increment.
------------------------------------------------ */

const isFirstBid =
!state.highestBidder;

const nextBidAmount =
isFirstBid
? Number(state.currentBid || 0)
: Number(state.currentBid || 0) + 10;

bidButton.textContent =
isFirstBid
? "BID"
: "BID +₹10";


bidButton.disabled =
!auctionActive ||
alreadySkipped ||
teamComplete ||
isHighestBidder ||
!me ||
Number(me.maximumBid) <
nextBidAmount;


skipButton.disabled =
!auctionActive ||
alreadySkipped ||
teamComplete ||
isHighestBidder ||
!me;


/* -----------------------------------------------
PLAYERS
------------------------------------------------ */

renderPlayers(
state.players || [],
state.highestBidder,
state.skippedPlayers || []
);


if (state.pokemonHidden) {

hiddenPokemon.style.display =
"flex";
}
}


/* =====================================================
RENDER PLAYERS
===================================================== */

function renderPlayers(
players,
highestBidder,
skippedPlayers
) {

playersList.innerHTML =
"";

const skippedSet = new Set(
    Array.isArray(skippedPlayers)
        ? skippedPlayers
        : []
);

players.forEach(
player => {

const card =
document.createElement(
"div"
);

card.className =
"player-card";


if (
player.playerId ===
highestBidder
) {

card.classList.add(
"highest"
);
}

const isSkipped =
    skippedSet.has(player.playerId);

if (isSkipped) {
    card.classList.add("skipped");
}


const highestLabel =
player.playerId ===
highestBidder

? `
<div class="highest-label">
HIGHEST BID
</div>
`

: "";


const avFile = player.avatar || "";
const avHtml = avFile
    ? `<img src="/images/avatars/${encodeURIComponent(avFile)}" alt="" style="width:28px;height:28px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(0,220,255,0.5);vertical-align:middle;margin-right:8px;" onerror="this.style.display='none'">`
    : "";

const nameHtml = `${avHtml}${escapeHtml(player.name)}`;

card.innerHTML = `
${highestLabel}

<div class="player-name">
${nameHtml}
</div>

<div class="player-money">
💰 ₹${Number(
player.money
).toLocaleString()}
</div>

<div class="player-team">
Pokémon:
${player.pokemonCount || 0}
/ 6
</div>
`;


playersList.appendChild(
card
);
}
);
}


/* =====================================================
RENDER TEAM
===================================================== */

function renderTeam(
pokemonNames,
pokemonDetails
) {

/*
* Support both legacy string names and full
* objects { name, officialArtwork, sprite, type }.
*/

const rawList =
Array.isArray(pokemonNames)
? pokemonNames
: [];

const names =
rawList.map(item => {
    if (typeof item === "string") {
        return item;
    }
    if (item && typeof item === "object") {
        return item.name || "";
    }
    return "";
});

const detailsFromTeam =
rawList.map(item => {
    if (item && typeof item === "object" && item.name) {
        return item;
    }
    return null;
});

const details =
Array.isArray(pokemonDetails) && pokemonDetails.length
? pokemonDetails
: detailsFromTeam;


/*
* If the team has not changed, do absolutely
* nothing. This prevents the Pokémon images
* from flickering/glitching every second.
*/

const teamKey =
names.join("|");


if (
teamKey ===
renderedTeamKey
) {

return;
}


renderedTeamKey =
teamKey;


/*
* Build the six slots only when the team
* actually changes.
*/

teamGrid.innerHTML =
"";


for (
let i = 0;
i < 6;
i++
) {

const slot =
document.createElement(
"div"
);


const pokemonName =
details[i]?.name ||
names[i];


if (pokemonName) {

slot.className =
"team-slot has-pokemon";


slot.innerHTML = `
<img
src=""
alt="${escapeAttribute(
pokemonName
)}"
loading="eager"
>

<div class="team-name">
${escapeHtml(
pokemonName
)}
</div>
`;


const image =
slot.querySelector(
"img"
);


/*
* If server supplied complete Pokémon
* information, use it immediately.
*/

const suppliedArtwork =
details[i]
?.officialArtwork ||
details[i]
?.sprites
?.other
?.["official-artwork"]
?.front_default ||
"";


const suppliedSprite =
suppliedArtwork ||
details[i]?.sprite ||
details[i]
?.sprites
?.front_default ||
"";


const suppliedType =
getPokemonType(
details[i]
);


if (suppliedSprite) {

image.src =
suppliedSprite;
}


if (suppliedType) {

slot.style.setProperty(
"--team-color",
pokemonTypeColors[
suppliedType
] ||
"#00ddff"
);
}


/*
* Check cache first.
*/

const cached =
teamPokemonCache.get(
pokemonName.toLowerCase()
);


if (cached) {

applyTeamPokemonData(
slot,
cached
);

} else {

/*
* Fetch only once.
*/

loadTeamPokemon(
pokemonName,
slot
);
}

} else {

slot.className =
"team-slot empty";

slot.innerHTML = `
<div
style="
font-size:28px;
opacity:.5;
font-family:Orbitron;
"
>
?
</div>

<div class="team-name">
EMPTY
</div>
`;
}


teamGrid.appendChild(
slot
);
}
}


/* =====================================================
LOAD TEAM POKEMON
===================================================== */

function loadTeamPokemon(
pokemonName,
slot
) {

const key =
pokemonName.toLowerCase();


/*
* Prevent duplicate requests if the same
* Pokémon is already being loaded.
*/

if (
teamPokemonCache.has(key)
) {

const cached =
teamPokemonCache.get(key);

if (cached) {

applyTeamPokemonData(
slot,
cached
);
}

return;
}


/*
* Store a loading marker.
*/

teamPokemonCache.set(
key,
null
);


fetch(
`https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(
key
)}`
)

.then(
response => {

if (!response.ok) {

throw new Error(
"Pokémon not found"
);
}

return response.json();
}
)

.then(
pokemonData => {

const officialArtwork =
pokemonData
?.sprites
?.other
?.["official-artwork"]
?.front_default ||
"";

const fallbackSprite =
pokemonData
?.sprites
?.front_default ||
"";

const type =
pokemonData
?.types?.[0]
?.type?.name ||
null;


const cachedData = {

officialArtwork:
officialArtwork,

sprite:
fallbackSprite,

type:
type
};


teamPokemonCache.set(
key,
cachedData
);


/*
* Apply to the currently visible slot.
*/
applyTeamPokemonData(
slot,
cachedData
);
}
)

.catch(
error => {

/*
* Remove failed cache entry so
* a later attempt can retry.
*/

teamPokemonCache.delete(
key
);

console.log(
"Could not load team Pokémon:",
error
);
}
);
}


/* =====================================================
APPLY TEAM POKEMON DATA
===================================================== */

function applyTeamPokemonData(
slot,
pokemonData
) {

if (
!slot ||
!pokemonData
) {

return;
}


const image =
slot.querySelector(
"img"
);


/*
* Always prefer Official Artwork.
*/

const artwork =
pokemonData.officialArtwork ||
pokemonData.sprite ||
"";


if (
image &&
artwork
) {

image.src =
artwork;
}


/*
* Apply Pokémon type color.
*/

if (
pokemonData.type &&
pokemonTypeColors[
pokemonData.type
]
) {

slot.style.setProperty(
"--team-color",
pokemonTypeColors[
pokemonData.type
]
);
}
}


/* =====================================================
BID
===================================================== */

bidButton.addEventListener(
"click",
() => {

if (
!playerId ||
!lobbyCode
) {

return;
}


socket.emit(
"placeBid",
{
playerId:
playerId,

lobbyCode:
lobbyCode
}
);
}
);


/* =====================================================
SKIP
===================================================== */

skipButton.addEventListener(
"click",
() => {

if (
!playerId ||
!lobbyCode
) {

return;
}


if (
skippedThisPokemon
) {

return;
}


skippedThisPokemon =
true;

skipButton.disabled =
true;

bidButton.disabled =
true;


socket.emit(
"skipPokemon",
{
playerId:
playerId,

lobbyCode:
lobbyCode
}
);
}
);


/* =====================================================
PLAYER SKIPPED
===================================================== */

socket.on(
"playerSkipped",
() => {

skippedThisPokemon =
true;
}
);


/* =====================================================
POKEMON SOLD
===================================================== */

socket.on(
"pokemonSold",
data => {

console.log(
"POKEMON SOLD:",
data
);

showSoldReveal(
data
);
}
);


/* =====================================================
POKEMON SKIPPED
===================================================== */

socket.on(
"pokemonSkipped",
data => {

console.log(
"POKEMON SKIPPED:",
data
);

showSkippedReveal(
data
);
}
);


/* =====================================================
LOAD POKEMON INFORMATION
===================================================== */

function loadPokemonInformation(
pokemonName
) {

if (
!pokemonName ||
pokemonName === "Pokémon"
) {

return Promise.reject(
new Error(
"Invalid Pokémon name"
)
);
}


return fetch(
`https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(
pokemonName.toLowerCase()
)}`
)

.then(
response => {

if (!response.ok) {

throw new Error(
"Pokémon not found"
);
}

return response.json();
}
);
}


/* =====================================================
SOLD REVEAL
===================================================== */

function showSoldReveal(data) {

clearTimeout(
revealTimeout
);


const pokemonName =
data.pokemon ||
"Pokémon";


const officialArtwork =
data.officialArtwork ||
"";


/*
* Official Artwork from server.
*/

revealImage.src =
officialArtwork ||
data.sprite ||
"";

revealImage.alt =
pokemonName;


revealTitle.textContent =
"IT'S " +
pokemonName +
"!";


const winnerName = data.winner || "Unknown Trainer";
const priceNum = Number(data.price || 0).toLocaleString();

revealSubtitle.innerHTML =
pokemonName +
' sold to <span class="sold-winner-name">"' +
escapeHtml(winnerName) +
'"</span> for ₹' +
priceNum;

revealPrice.textContent = "";

const winnerEl = document.getElementById("revealWinner");
if (winnerEl) {
    winnerEl.style.display = "none";
}


revealOverlay.className =
"reveal-overlay sold";

revealOverlay.classList.add(
"show"
);


document.body.classList.add(
"shake"
);


setTimeout(
() => {

document.body.classList.remove(
"shake"
);

},
500
);


/*
* Apply Pokémon type color.
*/

if (
data.type
) {

setAuctionPokemonColor(
{
type:
data.type
}
);
}


/*
* Fallback only when server does not
* provide artwork.
*/

if (
!officialArtwork &&
!data.sprite
) {

loadPokemonInformation(
pokemonName
)

.then(
pokemonData => {

const sprite =
pokemonData
?.sprites
?.other
?.["official-artwork"]
?.front_default ||
pokemonData
?.sprites
?.front_default ||
"";


if (sprite) {

revealImage.src =
sprite;
}


setAuctionPokemonColor(
pokemonData
);
}
)

.catch(
error => {

console.log(
"Could not load sold Pokémon information:",
error
);
}
);
}


/*
* Sound and announcer begin with the reveal.
*
* The animation itself is now longer, so the
* voice does not feel like it is coming after
* the Pokémon has already appeared.
*/

playRevealJingleThenCry(
    data.cry || null
);

spawnSoldPartyEffects();


revealTimeout =
setTimeout(
hideReveal,
5800
);
}


/* =====================================================
SKIPPED REVEAL
===================================================== */

function showSkippedReveal(data) {

clearTimeout(
revealTimeout
);


const pokemonName =
data.pokemon ||
"Pokémon";


const officialArtwork =
data.officialArtwork ||
"";


revealImage.src =
officialArtwork ||
data.sprite ||
"";

revealImage.alt =
pokemonName;


revealTitle.textContent =
pokemonName;


revealSubtitle.textContent =
"WAS SKIPPED";


revealPrice.textContent =
"NO BIDS";

const winnerEl =
document.getElementById("revealWinner");
if (winnerEl) {
    winnerEl.style.display = "none";
}


revealOverlay.className =
"reveal-overlay skipped";

revealOverlay.classList.add(
"show"
);


/*
* Apply server-supplied type.
*/

if (
data.type
) {

setAuctionPokemonColor(
{
type:
data.type
}
);
}


/*

window.AudioContext ||
window.webkitAudioContext;

new AudioContext();

ctx.currentTime;


const oscillator =
ctx.createOscillator();

const gain =
ctx.createGain();


oscillator.type =
"sawtooth";


oscillator.frequency.setValueAtTime(
220,
now
);

oscillator.frequency.exponentialRampToValueAtTime(
660,
now + 0.35
);


gain.gain.setValueAtTime(
0.001,
now
);

gain.gain.exponentialRampToValueAtTime(
0.35,
now + 0.04
);

gain.gain.exponentialRampToValueAtTime(
0.001,
now + 0.65
);


oscillator.connect(
gain
);

gain.connect(
ctx.destination
);


oscillator.start(
now
);

oscillator.stop(
now + 0.7
);


setTimeout(
() => {

ctx.close();

},
1000
);

} catch (error) {

console.log(
"Sound unavailable."
);
}
}

Place your file at: public/sounds/whos-that.mp3

let currentRevealAudio = null;

function stopRevealAudio() {

    try {
        if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
        }
    } catch (e) {}

    if (currentRevealAudio) {
        try {
            currentRevealAudio.pause();
            currentRevealAudio.src = "";
        } catch (e) {}
        currentRevealAudio = null;
    }
}


function playPokemonCry(cryUrl) {

    return new Promise(resolve => {

        if (!cryUrl) {
            resolve();
            return;
        }

        try {
            const cry =
                new Audio(cryUrl);

            cry.volume =
                0.9;

            currentRevealAudio =
                cry;

            let done = false;
            const finish = () => {
                if (done) return;
                done = true;
                resolve();
            };

            cry.addEventListener("ended", finish);
            cry.addEventListener("error", finish);

            cry.play().catch(err => {
                console.log(
                    "Cry play failed:",
                    err
                );
                finish();
            });

            /* Safety cap so UI never hangs */
            setTimeout(finish, 7000);

        } catch (error) {
            console.log(
                "Cry unavailable."
            );
            resolve();
        }
    });
}

/*
* 1) Play who's-that-style tanatana jingle
* 2) When it ends (or fails), play the Pokémon cry
*/
/* Resolves when jingle + cry have both finished */
let revealAudioDone = Promise.resolve();

function playRevealJingleThenCry(cryUrl) {

    stopRevealAudio();

    revealAudioDone = new Promise(resolve => {

        const jingle =
            new Audio(
                "/sounds/whos-that.mp3"
            );

        jingle.volume =
            0.85;

        currentRevealAudio =
            jingle;

        let cryStarted =
            false;

        const startCry =
            async () => {
                if (cryStarted) {
                    return;
                }
                cryStarted =
                    true;
                await playPokemonCry(
                    cryUrl
                );
                /* Small beat after cry ends */
                setTimeout(
                    resolve,
                    500
                );
            };

        jingle.addEventListener(
            "ended",
            startCry
        );

        jingle.addEventListener(
            "error",
            () => {
                /* No jingle file — go straight to cry */
                startCry();
            }
        );

        jingle
            .play()
            .catch(() => {
                startCry();
            });

        /* Safety: never block champion screen forever */
        setTimeout(
            () => {
                startCry();
            },
            10000
        );
    });

    return revealAudioDone;
}

/* =====================================================
FIREWORKS / STARDUST ENGINE
===================================================== */

let fireworksAnimId = null;
let fireworksParticles = [];

function startFireworks() {
    const canvas = document.getElementById("fireworksCanvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    function spawnBurst(x, y) {
        const colors = [
            "#ffd700", "#ff6b00", "#00e5ff",
            "#ff3d7f", "#a855f7", "#ffffff",
            "#7cff6b", "#ffeb3b"
        ];
        const count = 48 + Math.floor(Math.random() * 24);
        for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
            const speed = 1.5 + Math.random() * 4.5;
            fireworksParticles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1,
                decay: 0.012 + Math.random() * 0.018,
                size: 1.5 + Math.random() * 2.5,
                color: colors[Math.floor(Math.random() * colors.length)],
                type: Math.random() > 0.35 ? "spark" : "star"
            });
        }
        // Stardust drift
        for (let i = 0; i < 18; i++) {
            fireworksParticles.push({
                x: x + (Math.random() - 0.5) * 40,
                y: y + (Math.random() - 0.5) * 40,
                vx: (Math.random() - 0.5) * 0.8,
                vy: -0.4 - Math.random() * 1.2,
                life: 1,
                decay: 0.006 + Math.random() * 0.01,
                size: 0.8 + Math.random() * 1.4,
                color: "#fff8dc",
                type: "dust"
            });
        }
    }

    let lastBurst = 0;
    function loop(ts) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (ts - lastBurst > 550 + Math.random() * 400) {
            spawnBurst(
                canvas.width * (0.15 + Math.random() * 0.7),
                canvas.height * (0.12 + Math.random() * 0.45)
            );
            lastBurst = ts;
        }

        for (let i = fireworksParticles.length - 1; i >= 0; i--) {
            const p = fireworksParticles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.035;
            p.life -= p.decay;

            if (p.life <= 0) {
                fireworksParticles.splice(i, 1);
                continue;
            }

            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;

            if (p.type === "star") {
                ctx.beginPath();
                const s = p.size * 1.4;
                for (let k = 0; k < 5; k++) {
                    const a = (k * 4 * Math.PI) / 5 - Math.PI / 2;
                    const r = k === 0 ? s : s;
                    const px = p.x + Math.cos(a) * r;
                    const py = p.y + Math.sin(a) * r;
                    if (k === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.globalAlpha = 1;
        fireworksAnimId = requestAnimationFrame(loop);
    }

    // Initial center burst
    spawnBurst(canvas.width / 2, canvas.height * 0.35);
    spawnBurst(canvas.width * 0.3, canvas.height * 0.28);
    spawnBurst(canvas.width * 0.7, canvas.height * 0.28);
    fireworksAnimId = requestAnimationFrame(loop);
}

function stopFireworks() {
    if (fireworksAnimId) {
        cancelAnimationFrame(fireworksAnimId);
        fireworksAnimId = null;
    }
    fireworksParticles = [];
    const canvas = document.getElementById("fireworksCanvas");
    if (canvas) {
        const ctx = canvas.getContext("2d");
        ctx && ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
}


/* =====================================================
GRAND CHAMPION REVEAL
===================================================== */

function showChampionReveal(data) {
    const players = data.players || [];
    const winner = data.winner;

    // If no winner data, skip straight to teams
    if (!winner || !winner.playerId) {
        showFinalResults(data);
        return;
    }

    const overlay = document.getElementById("championOverlay");
    const avatarEl = document.getElementById("championAvatar");
    const nameEl = document.getElementById("championName");
    const reasonEl = document.getElementById("championReason");
    const monsEl = document.getElementById("championPokemon");
    const continueBtn = document.getElementById("championContinueBtn");

    if (!overlay) {
        showFinalResults(data);
        return;
    }

    const winnerPlayer = players.find(
        p => p.playerId === winner.playerId
    ) || winner;

    const avatarFile =
        winner.avatar ||
        winnerPlayer.avatar ||
        null;

    if (avatarEl) {
        if (avatarFile) {
            avatarEl.src =
                "/images/avatars/" +
                encodeURIComponent(avatarFile);
            avatarEl.style.display = "block";
        } else {
            avatarEl.style.display = "none";
        }
    }

    if (nameEl) {
        nameEl.textContent =
            winner.name ||
            winnerPlayer.name ||
            "Champion";
    }

    if (reasonEl) {
        reasonEl.textContent =
            data.reason ||
            "This team claimed victory in the tournament!";
    }

    if (monsEl) {
        monsEl.innerHTML = "";
        const list =
            (winnerPlayer && winnerPlayer.pokemon) ||
            [];
        list.forEach(p => {
            const img = document.createElement("img");
            img.src =
                p.officialArtwork ||
                p.sprite ||
                "";
            img.alt = p.name || "";
            img.loading = "eager";
            img.onerror = function () {
                this.style.opacity = "0.3";
            };
            monsEl.appendChild(img);
        });
    }

    overlay.classList.add("show");
    startFireworks();

    if (continueBtn) {
        continueBtn.onclick = () => {
            stopFireworks();
            overlay.classList.remove("show");
            showFinalResults(data);
        };
    }
}


/* =====================================================
FINAL RESULTS
===================================================== */

function showFinalResults(data) {

const overlay = document.getElementById("finalResultsOverlay");
const grid = document.getElementById("finalPlayersGrid");
const subtitle = document.getElementById("finalResultsSubtitle");

if (!overlay || !grid) {
    return;
}

const players = data.players || [];
const winnerId =
    data.winner && data.winner.playerId
        ? data.winner.playerId
        : null;

/* Show MY team first on MY screen, then everyone else */
const sortedPlayers = [...players].sort((a, b) => {
    if (a.playerId === playerId) return -1;
    if (b.playerId === playerId) return 1;
    return 0;
});

let sub =
    players.length +
    " trainer" +
    (players.length === 1 ? "" : "s") +
    " ready for battle!";
if (data.winner && data.winner.name) {
    sub = "🏆 Champion: " + data.winner.name;
}
subtitle.textContent = sub;

grid.innerHTML = "";

sortedPlayers.forEach(player => {
    const card = document.createElement("div");
    card.className = "final-player-card";

    const isMe = player.playerId === playerId;
    const isChamp =
        winnerId &&
        player.playerId === winnerId;

    if (isChamp) {
        card.style.border =
            "1px solid rgba(255, 215, 0, 0.55)";
        card.style.boxShadow =
            "0 0 24px rgba(255, 200, 50, 0.25)";
    }

    let pokemonHtml = "";
    const list = player.pokemon || [];
    let teamBst = 0;
    const typesSeen = new Set();

    if (list.length === 0) {
        pokemonHtml = '<div style="font-size:12px;color:rgba(255,255,255,0.45);">No Pokémon</div>';
    } else {
        list.forEach(p => {
            const isObj = p && typeof p === "object";
            const name = escapeHtml(
                isObj ? (p.name || "?") : String(p || "?")
            );
            const monBst = isObj ? (Number(p.bst) || 0) : 0;
            teamBst += monBst;
            if (isObj && p.type) typesSeen.add(p.type);
            let img = "";
            if (isObj) {
                img = escapeAttribute(
                    p.officialArtwork ||
                    p.sprite ||
                    (p.sprites && p.sprites.other && p.sprites.other["official-artwork"] && p.sprites.other["official-artwork"].front_default) ||
                    (p.sprites && p.sprites.front_default) ||
                    ""
                );
            }
            const bstLabel = monBst > 0
                ? ` <span style="opacity:0.65;font-size:10px;">BST ${monBst}</span>`
                : "";
            pokemonHtml += `
                <div class="final-pokemon-item">
                    <img src="${img}" alt="${name}" loading="eager" onerror="this.style.opacity='0.3'">
                    <span>${name}${bstLabel}</span>
                </div>
            `;
        });
    }

    // Prefer server ranking totals when available
    const rankInfo = (data.rankings || []).find(
        r => r.playerId === player.playerId
    );
    if (rankInfo && rankInfo.totalBst != null) {
        teamBst = Number(rankInfo.totalBst) || teamBst;
    }

    const avatarFile = player.avatar || "";
    const avatarHtml = avatarFile
        ? `<img class="final-player-avatar" src="/images/avatars/${encodeURIComponent(avatarFile)}" alt="" onerror="this.style.display='none'">`
        : "";

    const placeLabel = rankInfo && rankInfo.place
        ? ` · #${rankInfo.place}`
        : "";
    const scoreLabel = rankInfo && rankInfo.score != null
        ? ` · Score ${rankInfo.score}`
        : "";

    card.innerHTML = `
        <div class="final-player-name">
            ${avatarHtml}
            ${isChamp ? "🏆 " : ""}${isMe ? "★ " : ""}${escapeHtml(player.name)}${isMe ? " (YOU)" : ""}${isChamp ? " — CHAMPION" : ""}
        </div>
        <div class="final-player-money">
            💰 ₹${Number(player.money || 0).toLocaleString()} left · 🐾 ${list.length}/6
        </div>
        <div class="final-player-bst" style="font-size:12px;color:#ffd700;font-weight:700;margin:4px 0 8px;letter-spacing:0.3px;">
            ⚡ Team BST: ${teamBst.toLocaleString()}${placeLabel}${scoreLabel}
        </div>
        <div class="final-pokemon-list">
            ${pokemonHtml}
        </div>
    `;

    grid.appendChild(card);
});

/* Smooth fade-in of the end screen */
requestAnimationFrame(() => {
    overlay.classList.add("show");
});
}

    exitBtn.disabled = true;
}

socket.emit("returnToLobby", {
    lobbyCode: lobbyCode,
    playerId: playerId
});

/* Only this client navigates — others stay on results */
setTimeout(() => {
    window.location.href = "/lobby.html";
}, 600);

});


document.getElementById("exitGameBtn")?.addEventListener("click", () => {

const confirmed = confirm(
    "Exit the game and leave this lobby?"
);

if (!confirmed) {
    return;
}

const btn = document.getElementById("exitGameBtn");
const returnBtn = document.getElementById("returnToLobbyBtn");
if (btn) {
    btn.disabled = true;
    btn.textContent = "EXITING...";
}
if (returnBtn) {
    returnBtn.disabled = true;
}

socket.emit("exitGame", {
    lobbyCode: lobbyCode,
    playerId: playerId
});

});


socket.on("returnedToLobby", () => {
    window.location.href = "/lobby.html";
});


socket.on("exitedGame", () => {
    sessionStorage.removeItem("lobbyCode");
    window.location.href = "/setup.html";
});


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHtml(value) {

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);
}


/* =====================================================
ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(value) {

return escapeHtml(
value
);
}


/* =====================================================
SESSION SAFETY
===================================================== */

if (
!playerId ||
!lobbyCode
) {

showError(
"Player session not found. Please return to the lobby."
);
}


/* =====================================================
CLEANUP
===================================================== */

if ("speechSynthesis" in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged =
        function () {
            window.speechSynthesis.getVoices();
        };
}

window.addEventListener(
"beforeunload",
() => {
    stopRevealAudio();
}
);

</script>
